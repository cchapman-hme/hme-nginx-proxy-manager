# Production deployment — MariaDB (migration from jc21/nginx-proxy-manager)
#
# Usage:
#   1. Build the frontend first:  scripts/ci/frontend-build
#   2. Build & start:             sudo docker compose -f docker-compose.prod.yml up --build -d
#
# This preserves your existing MariaDB data. Mount the same volumes
# your jc21 deployment used. All features including SSO are supported.
#
# The SSO sidecar auto-detects DB_MYSQL_* env vars and connects to MariaDB
# for configuration. Session storage uses a local SQLite file (/data/sso/sessions.db).

services:
  app:
    image: hme-npm:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DB_MYSQL_HOST: "db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "${NPM_DB_USER}"
      DB_MYSQL_PASSWORD: "${NPM_DB_PASSWORD}"
      DB_MYSQL_NAME: "${NPM_DB_NAME}"
      DISABLE_IPV6: "true"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      - db
    networks:
      - npm-network

  db:
    image: jc21/mariadb-aria:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${NPM_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${NPM_DB_NAME}"
      MYSQL_USER: "${NPM_DB_USER}"
      MYSQL_PASSWORD: "${NPM_DB_PASSWORD}"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - npm-mysql:/var/lib/mysql
    networks:
      - npm-network

volumes:
  npm-data:
  npm-letsencrypt:
  npm-mysql:

networks:
  npm-network:
    driver: bridge
