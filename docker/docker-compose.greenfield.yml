# Greenfield deployment — SQLite (no external database required)
#
# Usage:
#   sudo docker compose -f docker-compose.greenfield.yml up -d
#
# Image is built and pushed automatically by GitHub Actions.
# See: .github/workflows/build-push.yml
#
# This is the simplest deployment: single container, SQLite for storage.
# All features work including SSO.

services:
  app:
    image: ghcr.io/cchapman-hme/hme-nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
      DISABLE_IPV6: "true"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt

volumes:
  npm-data:
  npm-letsencrypt:
