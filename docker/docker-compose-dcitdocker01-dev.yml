# dcitdocker01 — Migration from jc21/nginx-proxy-manager (MariaDB)
#
# Preserves existing host-bind-mount paths from the original deployment.
# SSO sidecar auto-detects DB_MYSQL_* and connects to the same MariaDB instance.
#
# Image is built and pushed automatically by GitHub Actions.
# See: .github/workflows/build-push.yml
#
# Deploy via Portainer: paste this YAML as a stack.

services:
  app:
    image: ghcr.io/cchapman-hme/hme-nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DB_MYSQL_HOST: "db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "5^Jpe4cldSn6"
      DB_MYSQL_NAME: "npm"
      DISABLE_IPV6: "true"
    volumes:
      - /var/docker/nginx-proxy-manager/data:/data
      - /var/docker/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    depends_on:
      - db
    networks:
      - npm-network

  db:
    image: jc21/mariadb-aria:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "npm"
      MYSQL_DATABASE: "npm"
      MYSQL_USER: "npm"
      MYSQL_PASSWORD: "5^Jpe4cldSn6"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - /var/docker/nginx-proxy-manager/mysql:/var/lib/mysql
    networks:
      - npm-network

networks:
  npm-network:
    driver: bridge
