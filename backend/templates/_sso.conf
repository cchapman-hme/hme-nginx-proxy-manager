{% if sso_enabled == 1 or sso_enabled == true %}
{% if sso_configured %}
    # Azure SSO: identity of the signed-in user (auth_request is enforced at server level)
    proxy_set_header X-SSO-User  $sso_user;
    proxy_set_header X-SSO-Email $sso_email;
    # An access list on an SSO host must not be able to satisfy the request on its own
    satisfy all;
{% endif %}
{% endif %}
