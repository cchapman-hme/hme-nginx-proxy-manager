name: Release

# Builds and publishes a fork release from an existing tag of the form
# vX.Y.Z-hme.N (X.Y.Z = upstream NginxProxyManager release, N = fork build).
# Called by upstream-sync.yml after it tags master, or run by hand.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z-hme.N)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z-hme.N)
        type: string
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        id: ver
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-hme\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z-hme.N"
            exit 1
          fi
          {
            echo "version=${TAG#v}"
            echo "upstream=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Stamp version into package manifests
        run: |
          V="${{ steps.ver.outputs.version }}"
          echo "$V" > .version
          for f in backend/package.json frontend/package.json; do
            sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$V\"/" "$f"
          done
          grep '"version"' backend/package.json frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "true"
        run: |
          yarn install --frozen-lockfile
          yarn locale-compile
          yarn build

      - name: Build date
        id: date
        run: echo "now=$(date -u '+%Y-%m-%d %T %Z')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.upstream }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.title=hme-nginx-proxy-manager

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.now }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UP="v${{ steps.ver.outputs.upstream }}"
          IMG="ghcr.io/${{ github.repository }}"
          PREV=$(git tag --list 'v*-hme.*' --sort=-v:refname | grep -v "^${{ inputs.tag }}$" | head -1 || true)
          {
            echo "Fork release of NginxProxyManager **${UP}** with the HME additions (Microsoft Entra ID SSO per proxy host)."
            echo
            echo "## Image"
            echo
            echo '```'
            echo "${IMG}:${{ steps.ver.outputs.version }}"
            echo "${IMG}:${{ steps.ver.outputs.upstream }}"
            echo "${IMG}:latest"
            echo '```'
            echo
            echo "## Upstream release notes"
            echo
            echo "https://github.com/NginxProxyManager/nginx-proxy-manager/releases/tag/${UP}"
            echo
            if [ -n "$PREV" ]; then
              echo "## Fork changes since ${PREV}"
              echo
              git log --no-merges --format='- %s (%h)' "${PREV}..${{ inputs.tag }}" -- backend/sso backend/lib/sso-helpers.js backend/templates docker .github frontend/src/pages/Settings frontend/src/modals/ProxyHostModal.tsx backend/internal/proxy-host.js backend/internal/nginx.js | head -50
              echo
              echo "Full diff: https://github.com/${{ github.repository }}/compare/${PREV}...${{ inputs.tag }}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
